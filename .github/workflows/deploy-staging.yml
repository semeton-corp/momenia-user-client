name: Deploy Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/app/memoria-user-client

            echo "Pull latest code..."
            git fetch origin
            git reset --hard origin/develop

            echo "Rebuild docker..."
            docker build -t momenia-staging \
              --build-arg ENV_FILE=.env.staging .

            echo "Restart container..."
            docker rm -f app-staging || true
            docker run -d -p 3001:3000 --name app-staging momenia-staging

            echo "Done 🚀"